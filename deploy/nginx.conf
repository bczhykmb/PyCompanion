# Replace python.example.com. This HTTP configuration is the starting point;
# issue a certificate and enable HTTPS before students sign in.
server {
    listen 80;
    server_name python.example.com;
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
